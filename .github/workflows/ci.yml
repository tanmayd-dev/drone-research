name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard-index:
    name: Dashboard index is complete
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check every dashboard is linked from visualizations/index.html
        run: ./scripts/check-index.sh

  python-tests:
    name: Python Algorithms Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/

  web-build:
    name: Web Application Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and verify build
        working-directory: web
        run: |
          npm ci
          npm run build
