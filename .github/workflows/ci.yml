name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard-index:
    name: Dashboard index is complete
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check every dashboard is linked from visualizations/index.html
        run: ./scripts/check-index.sh
